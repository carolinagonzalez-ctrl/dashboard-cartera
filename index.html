<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cartera | Transporte</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0c0f;
    --bg2: #111318;
    --bg3: #181c24;
    --border: #1e2330;
    --border2: #2a3045;
    --text: #e8ecf5;
    --text2: #8a93aa;
    --text3: #4a5268;
    --green: #00d48a;
    --yellow: #f5c542;
    --orange: #f58c42;
    --red: #e84040;
    --blue: #4a90e2;
    --accent: #00d48a;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; }

  /* HEADER */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, var(--green), #00a86b);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #000;
  }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .header-sub { font-size: 11px; color: var(--text3); font-family: var(--font-mono); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .last-update { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
  .btn-refresh {
    font-size: 11px; font-family: var(--font-mono);
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text2); padding: 6px 14px; border-radius: 6px;
    cursor: pointer; transition: all .15s;
  }
  .btn-refresh:hover { border-color: var(--green); color: var(--green); }

  /* LAYOUT */
  .main { padding: 1.5rem 2rem 3rem; max-width: 1400px; margin: 0 auto; }

  /* LOADING */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 1rem;
  }
  .spinner {
    width: 40px; height: 40px; border: 2px solid var(--border2);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text3); font-family: var(--font-mono); }

  /* ERROR */
  .error-box {
    background: rgba(232,64,64,.08); border: 1px solid rgba(232,64,64,.25);
    border-radius: 10px; padding: 1.5rem; margin: 2rem 0;
    font-size: 13px; color: #e84040; font-family: var(--font-mono);
  }

  /* KPI STRIP */
  .kpi-strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin-bottom: 1.5rem;
  }
  .kpi {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.25rem;
    transition: border-color .15s;
  }
  .kpi:hover { border-color: var(--border2); }
  .kpi-label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .kpi-val { font-size: 22px; font-weight: 700; line-height: 1; }
  .kpi-val.danger { color: var(--red); }
  .kpi-val.warn { color: var(--orange); }
  .kpi-val.ok { color: var(--green); }
  .kpi-val.neutral { color: var(--text); }
  .kpi-sub { font-size: 10px; color: var(--text3); font-family: var(--font-mono); margin-top: 5px; }

  /* SECTION TITLE */
  .sec { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin: 1.75rem 0 .875rem; font-family: var(--font-mono); }

  /* EMP CARDS */
  .emp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .emp-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.125rem 1.25rem;
    cursor: pointer; transition: all .15s;
  }
  .emp-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .emp-card.active { border-color: var(--green); background: rgba(0,212,138,.04); }
  .emp-card.active-all { border-color: var(--border2); }
  .emp-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .emp-total { font-size: 20px; font-weight: 700; color: var(--text); }
  .emp-pct-critical { font-size: 11px; font-family: var(--font-mono); margin-top: 4px; }
  .emp-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .emp-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--red), #ff6060); transition: width .4s; }

  /* GRID 2COL */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
  @media(max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }

  /* CHART CARD */
  .chart-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem;
  }
  .chart-title { font-size: 11px; color: var(--text2); font-family: var(--font-mono); font-weight: 500; margin-bottom: 1rem; }
  .chart-wrap { position: relative; height: 220px; }

  /* FILTERS */
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
  .filter-btn {
    font-size: 11px; font-family: var(--font-mono); font-weight: 500;
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text2); cursor: pointer; transition: all .12s;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active { border-color: var(--green); color: var(--green); background: rgba(0,212,138,.06); }
  .filter-label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px 9px 36px;
    color: var(--text); font-size: 12px; font-family: var(--font-mono);
    outline: none; transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--border2); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }

  /* TABLE */
  .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { background: var(--bg3); }
  th {
    padding: 10px 14px; text-align: left; font-size: 10px;
    color: var(--text3); font-family: var(--font-mono); font-weight: 500;
    text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    cursor: pointer; user-select: none; transition: color .12s;
  }
  th:hover { color: var(--text); }
  th.sort-asc::after { content: ' ↑'; color: var(--green); }
  th.sort-desc::after { content: ' ↓'; color: var(--green); }
  td {
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    color: var(--text2); white-space: nowrap; font-family: var(--font-mono);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }
  td.placa { color: var(--text); font-weight: 500; }
  td.num { text-align: right; }
  td.num.danger { color: var(--red); }
  td.num.warn { color: var(--orange); }
  td.num.ok { color: var(--green); }
  .badge {
    display: inline-block; font-size: 10px; font-family: var(--font-mono);
    padding: 2px 7px; border-radius: 4px; font-weight: 500;
  }
  .badge-tf { background: rgba(74,144,226,.15); color: #4a90e2; }
  .badge-real { background: rgba(245,197,66,.12); color: #f5c542; }
  .badge-micro { background: rgba(245,140,66,.12); color: #f58c42; }
  .badge-celu { background: rgba(0,212,138,.12); color: var(--green); }
  .badge-otro { background: rgba(138,147,170,.1); color: var(--text2); }

  /* BADGES NIVEL DE COBRO */
  .badge-aldia      { background: rgba(99,153,34,.15);  color: #639922; }
  .badge-preventivo { background: rgba(74,144,226,.15); color: #4a90e2; }
  .badge-activo     { background: rgba(239,159,39,.15); color: #EF9F27; }
  .badge-prejudicial{ background: rgba(216,90,48,.15);  color: #D85A30; }
  .badge-juridico   { background: rgba(121,31,31,.25);  color: #c94040; }

  /* PAGINATION */
  .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); }
  .page-info { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
  .page-btns { display: flex; gap: 6px; }
  .page-btn {
    font-size: 11px; font-family: var(--font-mono);
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 4px 10px; border-radius: 5px;
    cursor: pointer; transition: all .12s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .page-btn:disabled { opacity: .35; cursor: default; }

  /* MODAL */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 1.5rem; width: 90%; max-width: 480px;
    animation: fadeUp .2s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .modal-title { font-size: 14px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .modal-kpi { background: var(--bg3); border-radius: 8px; padding: .875rem; }
  .modal-kpi-label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 4px; }
  .modal-kpi-val { font-size: 18px; font-weight: 700; }
  .modal-kpi-sub { font-size: 10px; color: var(--text3); font-family: var(--font-mono); margin-top: 3px; }
  .modal-note { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 1rem; }
  .btn-action {
    width: 100%; padding: 10px; border-radius: 8px;
    background: rgba(0,212,138,.1); border: 1px solid rgba(0,212,138,.3);
    color: var(--green); font-size: 12px; font-family: var(--font-display);
    font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .btn-action:hover { background: rgba(0,212,138,.18); }

  /* EMPTY */
  .empty { text-align: center; padding: 3rem; color: var(--text3); font-size: 13px; font-family: var(--font-mono); }

  /* SETUP BOX */
  .setup-box {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 12px; padding: 2rem; max-width: 600px; margin: 3rem auto;
  }
  .setup-title { font-size: 18px; font-weight: 700; margin-bottom: .5rem; }
  .setup-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.6; }
  .setup-step { display: flex; gap: .75rem; margin-bottom: 1rem; align-items: flex-start; }
  .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-mono); color: var(--text3); flex-shrink: 0; margin-top: 1px; }
  .step-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .step-text code { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--green); font-family: var(--font-mono); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo-mark">T</div>
    <div>
      <div class="header-title">Dashboard de Cartera</div>
      <div class="header-sub">Transporte — Control de Cartera</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-update" id="lastUpdate">Cargando...</span>
    <button class="btn-refresh" onclick="loadData()">↻ Actualizar</button>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="mainContent">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Conectando con Google Sheets...</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN — Solo cambia el SHEET_ID si cambias de archivo
// ============================================================
const SHEET_ID = '18pj3qT3QOoWholSQCctsWVct2aRAHXTSqy2CQoWm6Bw';
const SHEET_TAB = 'DATA';
const ROWS_PER_PAGE = 25;

// Mapeo de empresas para badges
const EMP_CONFIG = {
  'TF':         { label: 'Taxis Ya TF',       badge: 'badge-tf',       color: '#4a90e2' },
  'REAL_TAXI':  { label: 'Real — Taxis',       badge: 'badge-real',     color: '#f5c542' },
  'REAL_MICRO': { label: 'Real — Microbuses',  badge: 'badge-micro',    color: '#f58c42' },
  'CELU':       { label: 'Celu Vans',          badge: 'badge-celu',     color: '#00d48a' },
  'VARIOS':     { label: 'Varios',             badge: 'badge-otro',     color: '#8a93aa' },
};

// Estado global
let allData = [];
let filtered = [];
let currentPage = 1;
let sortCol = 'DMAS120';
let sortDir = 'desc';
let filterEmp = 'ALL';
let filterEdad = 'ALL';
let filterConcepto = 'ALL';
let filterNivel = 'ALL';
let searchQ = '';
let charts = {};

// ============================================================
// CARGA DE DATOS
// ============================================================
async function loadData() {
  document.getElementById('mainContent').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Leyendo Google Sheets...</div>
    </div>`;

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('No se pudo leer el Sheets. Verifica que sea público.');
    const csv = await res.text();
    console.log('=== CSV RECIBIDO ===');
    console.log('Caracteres totales:', csv.length);
    console.log('Líneas totales:', csv.split('\n').length);
    console.log('Primeros 500 chars:', csv.substring(0, 500));
    allData = parseCSV(csv);
    console.log('Registros parseados:', allData.length);
    if (allData.length === 0) {
      showSetup();
      return;
    }
    document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleString('es-CO', {dateStyle:'short', timeStyle:'short'});
    applyFilters();
    render();
  } catch (err) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-box">
        ⚠ Error al cargar datos: ${err.message}<br><br>
        Asegúrate de que el Google Sheets sea público (Cualquiera con el enlace → Lector)
        y que la pestaña se llame exactamente <strong>DATA</strong>.
      </div>`;
  }
}

// ============================================================
// TELÉFONO — limpia y formatea para WhatsApp
// ============================================================
function limpiarTel(v) {
  if (!v) return '';
  let t = String(v).replace(/[^\d+]/g, ''); // solo dígitos y +
  if (t.startsWith('57') && t.length === 12) t = '+' + t;
  else if (t.startsWith('+57')) { /* ya está bien */ }
  else if (t.length === 10 && t.startsWith('3')) t = '+57' + t;
  else if (t.length > 0) t = '+57' + t.replace(/^\+?57/, '');
  return t;
}

function linkWhatsApp(tel, nombre, total) {
  if (!tel) return '—';
  const msg = encodeURIComponent(`Hola ${nombre}, le informamos que tiene una deuda pendiente de ${fFull(total)}. Por favor comuníquese con nosotros para gestionar su pago. Gracias.`);
  return `https://wa.me/${tel.replace('+','')}?text=${msg}`;
}

// ============================================================
// EXPORTAR EXCEL (CSV con BOM para Excel colombiano)
// ============================================================
function exportarExcel() {
  if (!filtered || filtered.length === 0) {
    alert('No hay registros para exportar con el filtro actual.');
    return;
  }

  const cols = [
    { key: 'PLACA',     label: 'Placa / ID' },
    { key: 'NOMBRE',    label: 'Nombre Completo' },
    { key: 'DOCUMENTO', label: 'Documento' },
    { key: 'TELEFONO',  label: 'Teléfono' },
    { key: 'WHATSAPP',  label: 'Link WhatsApp' },
    { key: 'NIVEL',     label: 'Nivel Cobro' },
    { key: 'EMPRESA',   label: 'Empresa' },
    { key: 'CONCEPTO',  label: 'Concepto' },
    { key: 'AL_DIA',    label: 'Al Día' },
    { key: 'D30',       label: '30 días' },
    { key: 'D60',       label: '60 días' },
    { key: 'D90',       label: '90 días' },
    { key: 'D120',      label: '120 días' },
    { key: 'DMAS120',   label: '+120 días' },
    { key: 'TOTAL',     label: 'Total' },
  ];

  const empLabel = e => EMP_CONFIG[e]?.label || e;

  // Fila de encabezado
  let csv = '\uFEFF'; // BOM para que Excel abra bien tildes
  csv += cols.map(c => `"${c.label}"`).join(';') + '\n';

  // Fila de totales del filtro
  const t = calcTotals(filtered);
  const totalRow = {
    PLACA: 'TOTAL FILTRO', NOMBRE: `${filtered.length} registros`,
    DOCUMENTO: '', TELEFONO: '', WHATSAPP: '',
    EMPRESA: '', CONCEPTO: '',
    AL_DIA: t.aldia, D30: t.d30, D60: t.d60,
    D90: t.d90, D120: t.d120, DMAS120: t.dmas120, TOTAL: t.total,
  };
  csv += cols.map(c => {
    const v = totalRow[c.key];
    return typeof v === 'number' ? String(Math.round(v)) : `"${v||''}"`;
  }).join(';') + '\n';
  csv += cols.map(() => '""').join(';') + '\n'; // fila vacía separadora

  // Datos
  filtered.forEach(r => {
    const waLink = linkWhatsApp(r.TELEFONO, r.NOMBRE, r.TOTAL);
    const row = { ...r, EMPRESA: empLabel(r.EMPRESA), WHATSAPP: waLink, NIVEL: NIVEL_CONFIG[getNivel(r)]?.label || '' };
    csv += cols.map(c => {
      const v = row[c.key];
      if (v === undefined || v === null || v === '') return '""';
      if (typeof v === 'number') return String(Math.round(v));
      return `"${String(v).replace(/"/g, '""')}"`;
    }).join(';') + '\n';
  });

  // Construir etiqueta del filtro para el nombre del archivo
  const partes = [];
  if (filterEmp !== 'ALL') partes.push(EMP_CONFIG[filterEmp]?.label || filterEmp);
  if (filterConcepto !== 'ALL') partes.push(filterConcepto.substring(0,20));
  if (filterEdad !== 'ALL') partes.push(filterEdad === 'AL_DIA' ? 'AlDia' : filterEdad + 'dias');
  const sufijo = partes.length > 0 ? '_' + partes.join('_').replace(/\s+/g,'_') : '_TodosLosFiltros';
  const fecha = new Date().toISOString().slice(0,10);
  const filename = `Cartera${sufijo}_${fecha}.csv`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(csv) {
  // Parser robusto: maneja celdas con saltos de línea, comas y comillas internas
  const records = parseCSVRobust(csv);
  if (records.length < 2) return [];

  function parseNum(v) {
    if (!v) return 0;
    let s = String(v).replace(/\s/g,'').replace(/"/g,'').replace(/\$/g,'');
    if (!s || s === '-') return 0;
    const hasDot = s.includes('.');
    const hasComma = s.includes(',');
    if (hasDot && hasComma) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
        s = s.replace(/\./g,'').replace(',','.');
      } else {
        s = s.replace(/,/g,'');
      }
    } else if (hasComma && !hasDot) {
      const parts = s.split(',');
      const esMiles = parts.length > 1 && parts.slice(1).every(p => p.length === 3);
      if (esMiles) {
        s = s.replace(/,/g,'');
      } else {
        s = s.replace(',','.');
      }
    } else if (hasDot && !hasComma) {
      const parts = s.split('.');
      if (parts.length === 2 && parts[1].length === 3) {
        s = s.replace(/\./g,'');
      }
    }
    return parseFloat(s) || 0;
  }

  const rawHeaders = records[0].map(h => h.replace(/"/g,'').trim());
  const headers = rawHeaders.map(h => h.toUpperCase());
  const rows = [];

  console.log('=== DEBUG CARTERA ===');
  console.log('Total filas CSV:', records.length - 1);
  console.log('Headers detectados:', headers);

  for (let i = 1; i < records.length; i++) {
    const vals = records[i];
    const row = {};
    rawHeaders.forEach((h, idx) => { row[h] = (vals[idx] || '').replace(/"/g,'').trim(); });
    headers.forEach((h, idx) => { row[h] = (vals[idx] || '').replace(/"/g,'').trim(); });

    const mapped = {};
    mapped['PLACA']     = row['PLACA'] || row['placa'] || '';
    mapped['CONCEPTO']  = row['CONCEPTO'] || row['Concepto'] || row['concepto'] || '';
    mapped['NOMBRE']    = ((row['NOMBRE'] || row['Nombre'] || '') + ' ' + (row['APELLIDOS'] || row['Apellidos'] || '')).trim();
    mapped['EMPRESA']   = row['EMPRESA'] || row['Empresa'] || '';
    mapped['DOCUMENTO'] = row['DOCUMENTO'] || row['Documento'] || row['documento'] || '';
    mapped['TELEFONO']  = limpiarTel(row['TELEFONO'] || row['Telefono'] || row['telefono'] || row['TEL'] || '');
    mapped['DIRECCION'] = row['DIRECCION'] || row['Direccion'] || row['direccion'] || '';
    mapped['AL_DIA']   = parseNum(row['AL DIA'] || row['al dia'] || row['AL_DIA'] || '');
    mapped['D30']      = parseNum(row['30 DIAS'] || row['30 dias'] || row['D30'] || '');
    mapped['D60']      = parseNum(row['60 DIAS'] || row['60 dias'] || row['D60'] || '');
    mapped['D90']      = parseNum(row['90 DIAS'] || row['90 dias'] || row['D90'] || '');
    mapped['D120']     = parseNum(row['120 DIAS'] || row['120 dias'] || row['D120'] || '');
    mapped['DMAS120']  = parseNum(row['MAS DE 120 DIAS'] || row['mas de 120 dias'] || row['DMAS120'] || '');
    mapped['TOTAL']    = parseNum(row['TOTAL'] || row['total'] || '');

    if (!mapped['PLACA'] && !mapped['NOMBRE']) continue;

    if (!mapped['EMPRESA']) {
      mapped['EMPRESA'] = detectEmpresa(mapped['CONCEPTO']);
    } else {
      mapped['EMPRESA'] = normalizeEmpresa(mapped['EMPRESA']);
    }

    if (mapped['TOTAL'] === 0) {
      mapped['TOTAL'] = mapped['AL_DIA'] + mapped['D30'] + mapped['D60'] + mapped['D90'] + mapped['D120'] + mapped['DMAS120'];
    }

    Object.assign(row, mapped);
    rows.push(row);
  }

  console.log('Registros válidos parseados:', rows.length);
  return rows;
}

// Parser CSV estándar RFC 4180 — maneja comillas, comas y saltos de línea dentro de celdas
function parseCSVRobust(text) {
  const records = [];
  let record = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const n = text.length;

  while (i < n) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < n && text[i+1] === '"') {
          // comilla escapada ""
          field += '"';
          i += 2;
        } else {
          // cierre de comillas
          inQuotes = false;
          i++;
        }
      } else {
        field += ch;
        i++;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
        i++;
      } else if (ch === ',') {
        record.push(field);
        field = '';
        i++;
      } else if (ch === '\n') {
        record.push(field);
        field = '';
        records.push(record);
        record = [];
        i++;
      } else if (ch === '\r') {
        // saltar \r de Windows
        i++;
      } else {
        field += ch;
        i++;
      }
    }
  }
  // última celda y fila
  if (field || record.length > 0) {
    record.push(field);
    records.push(record);
  }
  return records.filter(r => r.some(c => c.trim() !== ''));
}

// NIVELES DE COBRO
// ============================================================
const NIVEL_CONFIG = {
  'JURIDICO':    { label: 'Jurídico',          badge: 'badge-juridico',    color: '#791F1F', orden: 5 },
  'PREJUDICIAL': { label: 'Pre-Jurídico',       badge: 'badge-prejudicial', color: '#D85A30', orden: 4 },
  'ACTIVO':      { label: 'Gestión Activa',     badge: 'badge-activo',      color: '#EF9F27', orden: 3 },
  'PREVENTIVO':  { label: 'Gestión Preventiva', badge: 'badge-preventivo',  color: '#4a90e2', orden: 2 },
  'ALDIA':       { label: 'Al Día',             badge: 'badge-aldia',       color: '#639922', orden: 1 },
};

function getNivel(r) {
  if (r.DMAS120 > 0) return 'JURIDICO';
  if (r.D120    > 0) return 'PREJUDICIAL';
  if (r.D60     > 0) return 'ACTIVO';
  if (r.D30     > 0) return 'PREVENTIVO';
  return 'ALDIA';
}

function detectEmpresa(concepto) {
  const c = concepto.toUpperCase().trim();
  // Mapeo exacto por concepto
  if (c === 'RODAMIENTO-(TF)')                        return 'TF';
  if (c === 'SERVICIO AL AFILIADO')                   return 'TF';
  if (c === 'SERVICIO AL AFILIADO ADICIONAL')         return 'TF';
  if (c === 'FRECUENCIA (ESP)')                       return 'TF';
  if (c === 'RODAMIENTO REAL')                        return 'REAL_TAXI';
  if (c === 'RODAMIENTO MICROBUSES')                  return 'REAL_MICRO';
  if (c === 'RCC RCE 2022 REAL ESPEC. CAMIONETAS -VANS') return 'REAL_MICRO';
  if (c === 'RODAMIENTO-CELUVANS')                    return 'CELU';
  if (c === 'CREDITO SEGUROS CELU')                   return 'CELU';
  if (c === 'RCC RCE AP BUS/BUSETA 2024')             return 'CELU';
  // Parciales como fallback
  if (c.includes('TF') || c.includes('FRECUENCIA'))  return 'TF';
  if (c.includes('MICROBUS'))                        return 'REAL_MICRO';
  if (c.includes('REAL'))                            return 'REAL_TAXI';
  if (c.includes('CELU') || c.includes('VAN'))       return 'CELU';
  return 'VARIOS';
}

function normalizeEmpresa(e) {
  const u = e.toUpperCase().trim();
  if (u.includes('TF') || u.includes('TAXIS YA')) return 'TF';
  if (u.includes('MICRO'))                         return 'REAL_MICRO';
  if (u.includes('REAL'))                          return 'REAL_TAXI';
  if (u.includes('CELU') || u.includes('VAN'))     return 'CELU';
  return 'VARIOS';
}

// FILTROS Y ORDEN
// ============================================================
function applyFilters() {
  filtered = allData.filter(r => {
    const matchEmp     = filterEmp     === 'ALL' || r.EMPRESA === filterEmp;
    const matchConcepto= filterConcepto=== 'ALL' || r.CONCEPTO === filterConcepto;
    const matchNivel   = filterNivel   === 'ALL' || getNivel(r) === filterNivel;
    let matchEdad = true;
    if (filterEdad === 'AL_DIA') matchEdad = r.AL_DIA > 0;
    else if (filterEdad === '30')   matchEdad = r.D30 > 0;
    else if (filterEdad === '60')   matchEdad = r.D60 > 0;
    else if (filterEdad === '90')   matchEdad = r.D90 > 0;
    else if (filterEdad === '120')  matchEdad = r.D120 > 0;
    else if (filterEdad === '+120') matchEdad = r.DMAS120 > 0;
    const q = searchQ.toLowerCase();
    const matchQ = !q || (r.PLACA||'').toLowerCase().includes(q) || (r.NOMBRE||'').toLowerCase().includes(q);
    return matchEmp && matchEdad && matchConcepto && matchNivel && matchQ;
  });
  filtered.sort((a, b) => {
    const av = a[sortCol] !== undefined ? a[sortCol] : '';
    const bv = b[sortCol] !== undefined ? b[sortCol] : '';
    if (typeof av === 'number') return sortDir === 'desc' ? bv - av : av - bv;
    return sortDir === 'desc' ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
  });
  currentPage = 1;
}

function getEdadBucket(r) {
  if (r.DMAS120 > 0) return '+120';
  if (r.D120 > 0) return '120';
  if (r.D90 > 0) return '90';
  if (r.D60 > 0) return '60';
  if (r.D30 > 0) return '30';
  return 'AL_DIA';
}

// ============================================================
// CÁLCULOS AGREGADOS
// ============================================================
function calcTotals(data) {
  return data.reduce((acc, r) => {
    acc.total += r.TOTAL; acc.aldia += r.AL_DIA;
    acc.d30 += r.D30; acc.d60 += r.D60; acc.d90 += r.D90;
    acc.d120 += r.D120; acc.dmas120 += r.DMAS120;
    return acc;
  }, {total:0,aldia:0,d30:0,d60:0,d90:0,d120:0,dmas120:0});
}

function calcByEmp() {
  const emp = {};
  allData.forEach(r => {
    if (!emp[r.EMPRESA]) emp[r.EMPRESA] = {total:0,aldia:0,d30:0,d60:0,d90:0,d120:0,dmas120:0,count:0};
    emp[r.EMPRESA].total += r.TOTAL;
    emp[r.EMPRESA].aldia += r.AL_DIA;
    emp[r.EMPRESA].d30 += r.D30;
    emp[r.EMPRESA].d60 += r.D60;
    emp[r.EMPRESA].d90 += r.D90;
    emp[r.EMPRESA].d120 += r.D120;
    emp[r.EMPRESA].dmas120 += r.DMAS120;
    emp[r.EMPRESA].count++;
  });
  return emp;
}

// ============================================================
// FORMATO
// ============================================================
function fCOP(v) {
  if (v >= 1e9) return '$' + (v/1e9).toFixed(1) + ' B';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + ' M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(0) + ' K';
  return '$' + v.toFixed(0);
}
function fFull(v) {
  return '$' + Math.round(v).toLocaleString('es-CO');
}
function pct(part, total) {
  return total > 0 ? Math.round(part/total*100) : 0;
}

        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span style="font-size:10px;color:var(--text2);font-family:var(--font-mono);text-transform:uppercase;margin-right:4px">Por nivel:</span>
        ${Object.entries(NIVEL_CONFIG).sort((a,b)=>b[1].orden-a[1].orden).map(([key,cfg])=>`
          <div style="display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer"
               onclick="setFilterNivel('${key}')">
            <span class="badge ${cfg.badge}" style="font-size:9px">${cfg.label}</span>
            <span style="font-size:11px;font-weight:700;color:var(--text)">${porNivel[key].count.toLocaleString('es-CO')}</span>
            <span style="font-size:10px;color:var(--text2)">${fCOP(porNivel[key].total)}</span>
          </div>`).join('')}
        ${filterNivel !== 'ALL' ? `<button onclick="setFilterNivel('ALL')" style="font-size:10px;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text2);cursor:pointer">✕ Limpiar nivel</button>` : ''}
      </div>
    </div>`;
}

function renderTabla() {
  renderFiltroResumen();
  const card = document.getElementById('tableCard');
  if (!card) return;
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / ROWS_PER_PAGE));
  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const slice = filtered.slice(start, start + ROWS_PER_PAGE);

  const cols = [
    { key: 'PLACA',    label: 'Placa / ID' },
    { key: 'NOMBRE',   label: 'Nombre' },
    { key: 'EMPRESA',  label: 'Empresa' },
    { key: 'NIVEL',    label: 'Nivel Cobro' },
    { key: 'CONCEPTO', label: 'Concepto' },
    { key: 'AL_DIA',   label: 'Al día' },
    { key: 'D30',      label: '30d' },
    { key: 'D60',      label: '60d' },
    { key: 'D90',      label: '90d' },
    { key: 'D120',     label: '120d' },
    { key: 'DMAS120',  label: '+120d' },
    { key: 'TOTAL',    label: 'Total' },
  ];

  const thHTML = cols.map(c => {
    const cls = sortCol === c.key ? `sort-${sortDir}` : '';
    return `<th class="${cls}" onclick="setSort('${c.key}')">${c.label}</th>`;
  }).join('');

  const rowsHTML = slice.length === 0
    ? `<tr><td colspan="${cols.length}" class="empty">Sin resultados para los filtros aplicados</td></tr>`
    : slice.map(r => {
        const cfg = EMP_CONFIG[r.EMPRESA] || EMP_CONFIG['OTRO'];
        const nKey = getNivel(r);
        const nCfg = NIVEL_CONFIG[nKey];
        return `<tr>
          <td class="placa">${r.PLACA || '—'}</td>
          <td>${r.NOMBRE || '—'}</td>
          <td><span class="badge ${cfg.badge}">${cfg.label}</span></td>
          <td><span class="badge ${nCfg.badge}">${nCfg.label}</span></td>
          <td style="color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${r.CONCEPTO||''}">${r.CONCEPTO || '—'}</td>
          <td class="num ok">${r.AL_DIA > 0 ? fCOP(r.AL_DIA) : '—'}</td>
          <td class="num">${r.D30 > 0 ? fCOP(r.D30) : '—'}</td>
          <td class="num warn">${r.D60 > 0 ? fCOP(r.D60) : '—'}</td>
          <td class="num warn">${r.D90 > 0 ? fCOP(r.D90) : '—'}</td>
          <td class="num danger">${r.D120 > 0 ? fCOP(r.D120) : '—'}</td>
          <td class="num danger" style="font-weight:600">${r.DMAS120 > 0 ? fCOP(r.DMAS120) : '—'}</td>
          <td class="num" style="color:var(--text);font-weight:600" title="${fFull(r.TOTAL)}">${fCOP(r.TOTAL)}</td>
        </tr>`;
      }).join('');

  card.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr>${thHTML}</tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>
    <div class="pagination">
      <span class="page-info">${total} registros · Página ${currentPage} de ${pages}</span>
      <div class="page-btns">
        <button class="page-btn" onclick="goPage(1)" ${currentPage===1?'disabled':''}>«</button>
        <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
        <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=pages?'disabled':''}>›</button>
        <button class="page-btn" onclick="goPage(${pages})" ${currentPage>=pages?'disabled':''}>»</button>
      </div>
    </div>`;
}

// ============================================================
// INTERACTIVIDAD
// ============================================================
function setFilterEmp(e)      { filterEmp = e;       applyFilters(); render(); }
function setFilterEdad(e)     { filterEdad = e;      applyFilters(); renderTabla(); }
function setFilterConcepto(c) { filterConcepto = c;  applyFilters(); renderTabla(); }
function setFilterNivel(n)    { filterNivel = n;     applyFilters(); render(); }
function onSearch(v)          { searchQ = v;         applyFilters(); renderTabla(); }
function setSort(col) {
  if (sortCol === col) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  else { sortCol = col; sortDir = 'desc'; }
  applyFilters(); renderTabla();
}
function goPage(p) { currentPage = p; renderTabla(); }

// ============================================================
// MODAL
// ============================================================
function cerrarModal() { document.getElementById('modalBg').classList.remove('show'); }

// ============================================================
// SETUP (si Sheets vacío)
// ============================================================

  document.getElementById('mainContent').innerHTML = `
    <div class="setup-box">
      <div class="setup-title">Sheets conectado ✓ — Agrega datos para comenzar</div>
      <div class="setup-sub">El Google Sheets está correctamente conectado, pero la pestaña DATA no tiene registros aún. Sigue estos pasos:</div>
      <div class="setup-step"><div class="step-num">1</div><div class="step-text">Abre el Google Sheets y ve a la pestaña <code>DATA</code></div></div>
      <div class="setup-step"><div class="step-num">2</div><div class="step-text">Asegúrate que la fila 1 tenga los encabezados: <code>PLACA, NOMBRE, CONCEPTO, EMPRESA, AL_DIA, D30, D60, D90, D120, DMAS120, TOTAL</code></div></div>
      <div class="setup-step"><div class="step-num">3</div><div class="step-text">Pega los datos del reporte de cartera a partir de la fila 2</div></div>
      <div class="setup-step"><div class="step-num">4</div><div class="step-text">Haz clic en <strong>↻ Actualizar</strong> arriba a la derecha</div></div>
    </div>`;
}

// ============================================================

loadData();
</script>
